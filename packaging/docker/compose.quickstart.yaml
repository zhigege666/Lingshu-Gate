# Released-image evaluation on this computer. Select this file explicitly.
name: lingshu-gate-quickstart

services:
  core:
    image: ${LINGSHU_GATE_IMAGE:?Copy .env.quickstart.example to .env.quickstart}
    pull_policy: ${LINGSHU_GATE_PULL_POLICY:-missing}
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:${LINGSHU_GATE_HTTP_PORT:-8000}:8000"
    environment:
      LINGSHU_GATE_HOST: 0.0.0.0
      LINGSHU_GATE_PORT: "8000"
      LINGSHU_GATE_ALLOWED_ROOT: /workspace
      LINGSHU_GATE_CONFIG_DIR: /config/mcp.d
      LINGSHU_GATE_DATA_DIR: /data
      LINGSHU_GATE_AUTH_ENABLED: "true"
      LINGSHU_GATE_AUTH_COOKIE_SECURE: "false"
      LINGSHU_GATE_IN_CONTAINER: "1"
      LINGSHU_GATE_RUNTIME_ROLE: core
      LINGSHU_GATE_TRUSTED_PROXY_IPS: ""
      LINGSHU_GATE_MCP_ALLOWED_ORIGINS: ${LINGSHU_GATE_MCP_ALLOWED_ORIGINS:-}
      LINGSHU_GATE_LOG_PAYLOADS: "false"
    volumes:
      - config:/config
      - data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# The image's empty /workspace is part of the read-only root filesystem.
# Compose scopes these volumes to this project, separate from production.
volumes:
  config:
  data:
