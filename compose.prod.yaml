name: lingshu-gate-prod

services:
  core:
    image: ${LINGSHU_GATE_IMAGE:?Set a digest-pinned Lingshu Gate image}
    pull_policy: ${LINGSHU_GATE_PULL_POLICY:-always}
    init: true
    restart: always
    user: "10001:10001"
    read_only: true
    ports:
      - "${LINGSHU_GATE_BIND_ADDRESS:-127.0.0.1}:${LINGSHU_GATE_HTTP_PORT:-8000}:8000"
    environment:
      LINGSHU_GATE_HOST: 0.0.0.0
      LINGSHU_GATE_PORT: "8000"
      LINGSHU_GATE_ALLOWED_ROOT: /workspace
      LINGSHU_GATE_CONFIG_DIR: /config/mcp.d
      LINGSHU_GATE_DATA_DIR: /data
      LINGSHU_GATE_AUTH_ENABLED: "true"
      LINGSHU_GATE_AUTH_COOKIE_SECURE: "true"
      LINGSHU_GATE_ADMIN_USERNAME: ${LINGSHU_GATE_BOOTSTRAP_ADMIN_USERNAME:?Set a one-time bootstrap administrator username}
      LINGSHU_GATE_BOOTSTRAP_PASSWORD_FILE: /run/secrets/lingshu_gate_bootstrap_admin_password
      LINGSHU_GATE_IN_CONTAINER: "1"
      LINGSHU_GATE_RUNTIME_ROLE: core
      LINGSHU_GATE_TRUSTED_PROXY_IPS: ${LINGSHU_GATE_TRUSTED_PROXY_IPS:-127.0.0.1}
      LINGSHU_GATE_MCP_ALLOWED_ORIGINS: ${LINGSHU_GATE_MCP_ALLOWED_ORIGINS:-}
      LINGSHU_GATE_LOG_LEVEL: ${LINGSHU_GATE_LOG_LEVEL:-INFO}
      LINGSHU_GATE_LOG_PAYLOADS: "false"
    volumes:
      - type: bind
        source: ${LINGSHU_GATE_WORKSPACE_ROOT:-/srv/lingshu-gate/workspace}
        target: /workspace
        read_only: true
      - type: volume
        source: config
        target: /config
      - type: volume
        source: data
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    secrets:
      - source: bootstrap_admin_password
        target: lingshu_gate_bootstrap_admin_password
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${LINGSHU_GATE_PIDS_LIMIT:-256}
    mem_limit: ${LINGSHU_GATE_MEMORY_LIMIT:-1g}
    cpus: ${LINGSHU_GATE_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: ${LINGSHU_GATE_LOG_MAX_SIZE:-10m}
        max-file: ${LINGSHU_GATE_LOG_MAX_FILES:-5}
    networks:
      - edge

networks:
  edge:
    driver: bridge

secrets:
  bootstrap_admin_password:
    file: ${LINGSHU_GATE_BOOTSTRAP_PASSWORD_FILE:?Set an absolute host path to the one-time bootstrap administrator password file}

volumes:
  config:
    name: ${LINGSHU_GATE_CONFIG_VOLUME:-lingshu-gate-prod-config}
  data:
    name: ${LINGSHU_GATE_DATA_VOLUME:-lingshu-gate-prod-data}
