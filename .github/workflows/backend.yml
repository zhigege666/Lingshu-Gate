name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    # The full backend suite takes about 29 minutes; reserve setup and browser-smoke time.
    timeout-minutes: 40
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository identity and version
        run: |
          python scripts/quality/check_repository_identity.py --history
          python -m scripts.release.check_version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify and build Console once
        working-directory: web
        run: |
          npm ci
          npm run check:ux
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Verify pip export is synchronized
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.lock
          diff --unified requirements.lock /tmp/requirements.lock

      - name: Verify backend on Python 3.12
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync pytest -q

      - name: Install browser for isolated smoke
        working-directory: web
        run: timeout 180 npx playwright install --with-deps chromium

      - name: Test Console against isolated real backend
        run: timeout --kill-after=5 180 npm --prefix web run e2e:smoke

      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Share tested Console with compatibility jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-console-${{ github.sha }}
          path: src/lingshu_gate/static/console
          if-no-files-found: error
          retention-days: 1

      - name: Share built OAuth assets with compatibility jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-oauth-${{ github.sha }}
          path: src/lingshu_gate/static/oauth
          if-no-files-found: error
          retention-days: 1

  compatibility:
    name: Python ${{ matrix.python-version }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Console from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-console-${{ github.sha }}
          path: src/lingshu_gate/static/console

      - name: Download OAuth assets from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-oauth-${{ github.sha }}
          path: src/lingshu_gate/static/oauth

      - name: Set up Node.js for packaging script tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Console dependencies for license tests
        working-directory: web
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run --no-sync pytest -q

  result:
    name: CI result
    if: always()
    needs: [source, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source and compatibility check
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          if [[ "$SOURCE_RESULT" != success || "$COMPATIBILITY_RESULT" != success ]]; then
            echo "Source and compatibility checks must both succeed"
            exit 1
          fi
