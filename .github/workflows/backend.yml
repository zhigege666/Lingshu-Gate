name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository identity and version
        run: |
          python scripts/quality/check_repository_identity.py --history
          python -m scripts.release.check_version

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify and build Console once
        working-directory: web
        run: |
          npm ci
          npm run check:ux
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Verify pip export is synchronized
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.lock
          diff --unified requirements.lock /tmp/requirements.lock

      - name: Verify backend on Python 3.12
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync pytest -q

      - name: Share tested Console with compatibility jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-console-${{ github.sha }}
          path: src/lingshu_gate/static/console
          if-no-files-found: error
          retention-days: 1

  compatibility:
    name: Python ${{ matrix.python-version }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download Console from this workflow run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-console-${{ github.sha }}
          path: src/lingshu_gate/static/console

      - name: Set up Node.js for packaging script tests
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Console dependencies for license tests
        working-directory: web
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run --no-sync pytest -q

  result:
    name: CI result
    if: always()
    needs: [source, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source and compatibility check
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          if [[ "$SOURCE_RESULT" != success || "$COMPATIBILITY_RESULT" != success ]]; then
            echo "Source and compatibility checks must both succeed"
            exit 1
          fi
