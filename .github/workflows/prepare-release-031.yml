name: Prepare isolated 0.3.1 recovery

on:
  push:
    branches: [maintenance/prepare-0.3.1]
    paths: [.github/workflows/prepare-release-031.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'zhigege666/Lingshu-Gate' && github.ref == 'refs/heads/maintenance/prepare-0.3.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the isolated preparation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up the repository-pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.33'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare only the approved recovery files
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              assert text.count(old) == 1, (path, 'unexpected source')
              file.write_text(text.replace(old, new), encoding='utf-8')
          replace_once('pyproject.toml', 'PyJWT[crypto]>=2.10,<3.0', 'PyJWT[crypto]>=2.14.0,<3.0')
          replace_once('src/lingshu_gate/_version.py', '__version__ = "0.3.0"', '__version__ = "0.3.1"')
          replace_once('docs/releases.md', 'The current source version is `0.3.0`.', 'The current source version is `0.3.1`.')
          replace_once('docs/zh-CN/releases.md', '当前源码版本为 `0.3.0`。', '当前源码版本为 `0.3.1`。')
          english = ('## 0.3.1 security and release recovery\n\n'
              'This source requires PyJWT 2.14.0 or later and locks PyJWT to 2.15.1, including the fix for CVE-2026-102268. '
              'The pip requirements export is regenerated from the same uv lock file. Existing RS256-only verification and default-disabled external authentication remain unchanged.\n\n'
              'The failed `v0.3.0` tag is retained at its original revision. The corrected source uses a new `v0.3.1` tag; '
              'neither a version change nor tag creation alone means release assets have passed validation or been published.\n\n')
          chinese = ('## 0.3.1 安全与发行恢复\n\n'
              '此源码要求 PyJWT 最低为 2.14.0，并将其锁定到 2.15.1，包含 CVE-2026-102268 的修复。'
              'pip 依赖导出文件从同一份 uv 锁文件重新生成。既有仅 RS256 的验证规则以及默认关闭的外部认证保持不变。\n\n'
              '失败的 `v0.3.0` Tag 保留在原修订。修正后的源码使用新的 `v0.3.1` Tag；'
              '版本变更或创建 Tag 本身不代表发行资产已通过验证或完成发布。\n\n')
          replace_once('docs/releases.md', '## Artifact matrix\n', english + '## Artifact matrix\n')
          replace_once('docs/zh-CN/releases.md', '## 产物矩阵\n', chinese + '## 产物矩阵\n')
          PY
          uv lock --upgrade-package pyjwt==2.15.1
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.lock
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.lock
          diff --unified requirements.lock /tmp/requirements.lock

      - name: Reject unrelated dependency updates
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          before = tomllib.loads(subprocess.check_output(['git', 'show', 'HEAD:uv.lock'], text=True))
          after = tomllib.loads(Path('uv.lock').read_text())
          def unaffected(lock):
              return [p for p in lock['package'] if p['name'] not in {'pyjwt', 'lingshu-gate'}]
          assert unaffected(before) == unaffected(after), 'unrelated dependency changes'
          expected = {'pyproject.toml', 'uv.lock', 'requirements.lock', 'src/lingshu_gate/_version.py', 'docs/releases.md', 'docs/zh-CN/releases.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --check
          python -m scripts.release.check_version --tag v0.3.1
          python scripts/quality/check_repository_identity.py --history

      - name: Test JWT and authorization with frozen dependencies
        run: |
          uv sync --frozen
          uv run --no-sync pytest -q tests/test_jwt_dependency_security.py tests/test_external_jwt_verifier.py tests/test_external_oauth_http.py tests/test_personal_access_contract.py tests/test_delegated_access_scope.py

      - name: Commit generated files only to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/maintenance/prepare-0.3.1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock requirements.lock src/lingshu_gate/_version.py docs/releases.md docs/zh-CN/releases.md
          git commit -m 'fix(release): regenerate patched JWT dependency locks for 0.3.1'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/maintenance/prepare-0.3.1
          git rev-parse HEAD
          git diff HEAD^ HEAD --stat
          git ls-tree HEAD pyproject.toml uv.lock requirements.lock src/lingshu_gate/_version.py docs/releases.md docs/zh-CN/releases.md tests/test_jwt_dependency_security.py
