name: Release quality diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Diagnose fixed 0.4.6 release source
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      LINGSHU_GATE_DIAGNOSTIC_SOURCE_SHA: d228cf7ad27f2688cc6e04e5210c8aa2ea88b646
      LINGSHU_GATE_DIAGNOSTIC_SOURCE_TREE: b6d33c23ea90174da2d8ab1d9aa0364599f6437c
      LINGSHU_GATE_DIAGNOSTIC_SOURCE_TAG: v0.4.6
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout exact diagnostic workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: diagnostic-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout fixed product source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d228cf7ad27f2688cc6e04e5210c8aa2ea88b646
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Verify source tag and separate workflow provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*arguments, cwd=None):
              return subprocess.check_output(["git", *arguments], cwd=cwd, text=True).strip()

          source_sha = git("rev-parse", "HEAD")
          source_tree = git("rev-parse", "HEAD^{tree}")
          source_tag = os.environ["LINGSHU_GATE_DIAGNOSTIC_SOURCE_TAG"]
          tag_ref = "refs/tags/" + source_tag
          assert source_sha == os.environ["LINGSHU_GATE_DIAGNOSTIC_SOURCE_SHA"], "Unexpected source SHA"
          assert source_tree == os.environ["LINGSHU_GATE_DIAGNOSTIC_SOURCE_TREE"], "Unexpected source tree"
          assert git("cat-file", "-t", tag_ref) == "commit", "Expected the existing lightweight tag"
          assert git("rev-parse", tag_ref) == source_sha, "Existing tag no longer matches source"
          assert not git("status", "--porcelain"), "Source checkout is not clean"

          tools = Path(os.environ["GITHUB_WORKSPACE"]) / "diagnostic-tools"
          tooling_sha = git("rev-parse", "HEAD", cwd=tools)
          assert tooling_sha == os.environ["GITHUB_WORKFLOW_SHA"], "Unexpected diagnostic tooling SHA"
          helper = tools / "scripts/quality/pytest_evidence.py"
          evidence = {
              "tested_source_sha": source_sha, "tested_source_tree": source_tree,
              "existing_tag": source_tag, "existing_tag_sha": git("rev-parse", tag_ref),
              "diagnostic_tooling_sha": tooling_sha, "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_event_sha": os.environ["GITHUB_SHA"],
              "diagnostic_helper_sha256": hashlib.sha256(helper.read_bytes()).hexdigest(),
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "gate-release-quality-provenance.json"
          with output.open("x") as stream:
              json.dump(evidence, stream, indent=2)
          print(json.dumps(evidence, sort_keys=True))
          PY
          python -m scripts.release.check_version --tag "$LINGSHU_GATE_DIAGNOSTIC_SOURCE_TAG"
          python scripts/quality/check_repository_identity.py --history

      - name: Set up release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Verify and build fixed-source Console
        working-directory: source/web
        run: |
          npm ci
          npm run check:ux
          npm test
          npm run build

      - name: Set up release uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.33"
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: source/uv.lock

      - name: Install frozen quality and release dependencies
        run: uv sync --frozen --group release

      - name: Verify fixed-source pip export
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/gate-diagnostic-requirements.lock"
          diff --unified requirements.lock "$RUNNER_TEMP/gate-diagnostic-requirements.lock"

      - name: Diagnose all original backend and release tests
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync python "$GITHUB_WORKSPACE/diagnostic-tools/scripts/quality/pytest_evidence.py" \
            -q -vv --tb=short --maxfail=1 \
            --gate-evidence-dir="$RUNNER_TEMP/gate-release-quality" \
            --junitxml="$RUNNER_TEMP/gate-release-quality/junit.xml" \
            -o junit_family=legacy -o faulthandler_timeout=120

      - name: Retain immediate failure and interrupted-session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-quality-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gate-release-quality-provenance.json
            ${{ runner.temp }}/gate-release-quality
          if-no-files-found: ignore
          retention-days: 3
